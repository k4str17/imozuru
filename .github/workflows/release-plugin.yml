name: Release plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. Use auto for the normal release policy.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Determine whether a release is needed
        id: plan
        shell: bash
        env:
          REQUESTED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin
          git pull --ff-only origin main

          current_version="$(python3 - <<'PY'
          import json
          with open("plugin.json", encoding="utf-8") as handle:
              print(json.load(handle)["version"])
          PY
          )"
          current_tag="v${current_version}"
          bump="${REQUESTED_BUMP}"
          should_release=false

          if [[ "${bump}" == "auto" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null; then
              if git diff --quiet "${current_tag}"..HEAD -- skills/; then
                echo "No skill changes since ${current_tag}; nothing to release."
                bump="none"
              else
                bump="patch"
                should_release=true
              fi
            else
              echo "${current_tag} does not exist yet; publishing the current version as the initial release."
              bump="none"
              should_release=true
            fi
          elif [[ "${bump}" == "none" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null; then
              echo "::error::${current_tag} already exists. Choose patch, minor, or major."
              exit 1
            fi
            should_release=true
          else
            should_release=true
          fi

          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "bump=${bump}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release metadata
        if: steps.plan.outputs.should_release == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/release_plugin.py --bump "${{ steps.plan.outputs.bump }}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit release metadata
        if: steps.plan.outputs.should_release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \\
            plugin.json \\
            .claude-plugin/plugin.json \\
            .claude-plugin/marketplace.json \\
            .agents/plugins/marketplace.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG}"
          fi

          # Preserve any commits that reached main while this job was running.
          # A conflict fails closed instead of overwriting main.
          git pull --rebase origin main
          git fetch --tags --force origin

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} was created while this release was being prepared."
            exit 1
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push --atomic origin HEAD:main "${TAG}"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \\
            --verify-tag \\
            --generate-notes \\
            --title "${TAG}"
